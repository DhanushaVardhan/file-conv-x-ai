# One-click deploy on Render: New + > Blueprint > pick this repository.
# Add only the keys you have; every one is optional. See README, step 3.
services:
  - type: web
    name: alembic
    runtime: node
    plan: free
    buildCommand: echo "no dependencies to install"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: ACCESS_CODE
        sync: false
